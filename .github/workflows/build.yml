name: Build Windows Installer
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Arrange files and create firebase_options from firebase_web.txt
        shell: bash
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi
          API_KEY=$(grep -o 'apiKey: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          APP_ID=$(grep -o 'appId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          SENDER=$(grep -o 'messagingSenderId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          PROJECT=$(grep -o 'projectId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          if [ -z "$API_KEY" ] || [ -z "$APP_ID" ] || [ -z "$PROJECT" ]; then echo "firebase_web.txt format problem"; exit 1; fi
          printf "import 'package:firebase_core/firebase_core.dart';\nclass DefaultFirebaseOptions {\n  static const FirebaseOptions currentPlatform = FirebaseOptions(\n    apiKey: '%s',\n    appId: '%s',\n    messagingSenderId: '%s',\n    projectId: '%s',\n  );\n}\n" "$API_KEY" "$APP_ID" "$SENDER" "$PROJECT" > lib/firebase_options.dart
      - name: Generate windows folder
        run: flutter create . --org com.goldshop --project-name gold_shop --platforms=windows
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle runtime and build single-file installer
        shell: bash
        run: |
          R=build/windows/x64/runner/Release
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll msvcp140_1.dll msvcp140_2.dll concrt140.dll; do
            cp "/c/Windows/System32/$f" "$R/" || true
          done
          rm -f $R/*.lib $R/*.exp
          mv $R/gold_shop.exe $R/Jawaher.exe
          choco install innosetup -y --no-progress
          cat > installer.iss <<'ISS'
          [Setup]
          AppId={{8F3B6A2C-5D41-4E7B-9C21-3A6D5F0B7E11}
          AppName=Jawaher
          AppVersion=1.0
          DefaultDirName={autopf}\Jawaher
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=Jawaher-Setup
          Compression=lzma2
          SolidCompression=yes
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\Jawaher"; Filename: "{app}\Jawaher.exe"
          Name: "{autodesktop}\Jawaher"; Filename: "{app}\Jawaher.exe"
          [Run]
          Filename: "{app}\Jawaher.exe"; Description: "Run Jawaher"; Flags: nowait postinstall skipifsilent
          ISS
          ISCC="$(ls -d /c/Program\ Files*/Inno\ Setup*/ISCC.exe 2>/dev/null | head -n 1)"
          if [ -z "$ISCC" ]; then echo "Inno Setup not found"; exit 1; fi
          "$ISCC" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Jawaher-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jawaher PC (latest)
          files: installer/Jawaher-Setup.exe
