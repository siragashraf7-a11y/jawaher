name: Build All
on:
  push:
    paths-ignore:
      - 'ci/**'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore signing key (so updates install over old versions)
        run: |
          if [ -f ci/debug.keystore ]; then mkdir -p ~/.android; cp ci/debug.keystore ~/.android/debug.keystore; fi
      - name: Arrange files
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi
      - name: Create firebase_options from google-services.json
        run: |
          API_KEY=$(jq -r '.client[0].api_key[0].current_key' google-services.json)
          APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' google-services.json)
          SENDER=$(jq -r '.project_info.project_number' google-services.json)
          PROJECT=$(jq -r '.project_info.project_id' google-services.json)
          printf "import 'package:firebase_core/firebase_core.dart';\nclass DefaultFirebaseOptions {\n  static const FirebaseOptions currentPlatform = FirebaseOptions(\n    apiKey: '%s',\n    appId: '%s',\n    messagingSenderId: '%s',\n    projectId: '%s',\n  );\n}\n" "$API_KEY" "$APP_ID" "$SENDER" "$PROJECT" > lib/firebase_options.dart
      - name: Generate android folder
        run: flutter create . --org com.goldshop --project-name gold_shop --platforms=android
      - name: minSdk 23 and internet permission
        run: |
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle.kts android/app/build.gradle || true
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Jawaher-Android.apk
      - name: Save signing key (first time only)
        run: |
          if [ ! -f ci/debug.keystore ] && [ -f ~/.android/debug.keystore ]; then
            mkdir -p ci
            cp ~/.android/debug.keystore ci/debug.keystore
            git config user.name "build-bot"
            git config user.email "bot@users.noreply.github.com"
            git add ci/debug.keystore
            git commit -m "save signing key [skip ci]"
            git push || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/Jawaher-Android.apk

  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Arrange files and create firebase_options from firebase_web.txt
        shell: bash
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi
          API_KEY=$(grep -o 'apiKey: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          APP_ID=$(grep -o 'appId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          SENDER=$(grep -o 'messagingSenderId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          PROJECT=$(grep -o 'projectId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          if [ -z "$API_KEY" ] || [ -z "$APP_ID" ] || [ -z "$PROJECT" ]; then echo "firebase_web.txt format problem"; exit 1; fi
          printf "import 'package:firebase_core/firebase_core.dart';\nclass DefaultFirebaseOptions {\n  static const FirebaseOptions currentPlatform = FirebaseOptions(\n    apiKey: '%s',\n    appId: '%s',\n    messagingSenderId: '%s',\n    projectId: '%s',\n  );\n}\n" "$API_KEY" "$APP_ID" "$SENDER" "$PROJECT" > lib/firebase_options.dart
      - name: Generate windows folder
        run: flutter create . --org com.goldshop --project-name gold_shop --platforms=windows
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - name: Bundle runtime and build single-file installer
        shell: bash
        run: |
          R=build/windows/x64/runner/Release
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll msvcp140_1.dll msvcp140_2.dll concrt140.dll; do
            cp "/c/Windows/System32/$f" "$R/" || true
          done
          rm -f $R/*.lib $R/*.exp
          mv $R/gold_shop.exe $R/Jawaher.exe
          choco install innosetup -y --no-progress
          cat > installer.iss <<'ISS'
          [Setup]
          AppId={{8F3B6A2C-5D41-4E7B-9C21-3A6D5F0B7E11}
          AppName=Jawaher
          AppVersion=1.0
          DefaultDirName={autopf}\Jawaher
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=Jawaher-Setup
          Compression=lzma2
          SolidCompression=yes
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\Jawaher"; Filename: "{app}\Jawaher.exe"
          Name: "{autodesktop}\Jawaher"; Filename: "{app}\Jawaher.exe"
          [Run]
          Filename: "{app}\Jawaher.exe"; Description: "Run Jawaher"; Flags: nowait postinstall skipifsilent
          Filename: "{app}\Jawaher.exe"; Flags: nowait; Check: WizardSilent
          ISS
          ISCC="$(ls -d /c/Program\ Files*/Inno\ Setup*/ISCC.exe 2>/dev/null | head -n 1)"
          if [ -z "$ISCC" ]; then echo "Inno Setup not found"; exit 1; fi
          "$ISCC" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Jawaher-Setup.exe

  package:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build ${{ github.run_number }}
          files: |
            out/android/Jawaher-Android.apk
            out/installer/Jawaher-Setup.exe
