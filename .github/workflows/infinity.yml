name: Infinity Build
on:
  push:
    paths-ignore:
      - 'ci/**'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore signing key (so updates install over old versions)
        run: |
          if [ -f ci/debug.keystore ]; then mkdir -p ~/.android; cp ci/debug.keystore ~/.android/debug.keystore; fi
      - name: Arrange files (newest upload of each file)
        run: |
          newest() {
            base="$1"; ext="$2"; best=""; bt=-1; bn=-1
            for f in ${base}*.${ext}; do
              [ -f "$f" ] || continue
              case "$f" in
                "${base}.${ext}") n=0 ;;
                "${base} ("[0-9]*").${ext}") n=$(echo "$f" | sed 's/.*(\([0-9]*\)).*/\1/') ;;
                *) continue ;;
              esac
              t=$(git log -1 --format=%ct -- "$f" 2>/dev/null)
              t=${t:-0}
              if [ "$t" -gt "$bt" ] || { [ "$t" -eq "$bt" ] && [ "$n" -gt "$bn" ]; }; then best="$f"; bt=$t; bn=$n; fi
            done
            printf '%s' "$best"
          }
          mkdir -p lib assets
          M="$(newest main dart)"; echo "main -> $M"
          [ -n "$M" ] || { echo "main.dart not found"; exit 1; }
          cp "$M" lib/main.dart
          P="$(newest pubspec yaml)"; echo "pubspec -> $P"
          [ -n "$P" ] || { echo "pubspec.yaml not found"; exit 1; }
          if [ "$P" != "pubspec.yaml" ]; then cp "$P" pubspec.yaml; fi
          L="$(newest logo png)"; echo "logo -> $L"
          if [ -n "$L" ]; then cp "$L" assets/logo.png; fi
      - name: Create firebase_options from google-services.json
        run: |
          API_KEY=$(jq -r '.client[0].api_key[0].current_key' google-services.json)
          APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' google-services.json)
          SENDER=$(jq -r '.project_info.project_number' google-services.json)
          PROJECT=$(jq -r '.project_info.project_id' google-services.json)
          printf "import 'package:firebase_core/firebase_core.dart';\nclass DefaultFirebaseOptions {\n  static const FirebaseOptions currentPlatform = FirebaseOptions(\n    apiKey: '%s',\n    appId: '%s',\n    messagingSenderId: '%s',\n    projectId: '%s',\n  );\n}\n" "$API_KEY" "$APP_ID" "$SENDER" "$PROJECT" > lib/firebase_options.dart
      - name: Generate android folder
        run: flutter create . --org com.goldshop --project-name gold_shop --platforms=android
      - name: minSdk 23 and internet permission
        run: |
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle.kts android/app/build.gradle || true
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Disable lint vital (fixes the lint crash)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i '0,/^android {/s//android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' android/app/build.gradle
          fi
      - name: Brand name and icon
        run: |
          sed -i 's/android:label="gold_shop"/android:label="Infinity System"/' android/app/src/main/AndroidManifest.xml || true
          if [ -f logo.png ]; then
            for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${p%%:*}
              z=${p##*:}
              convert logo.png -resize ${z}x${z} android/app/src/main/res/mipmap-$d/ic_launcher.png || true
            done
          fi
      - run: flutter pub get
      - name: Build number
        run: echo "BN=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - run: flutter build apk --release --no-shrink --dart-define=BUILD_NUMBER=$BN
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Jawaher-Android.apk
      - name: Save signing key (first time only)
        run: |
          if [ ! -f ci/debug.keystore ] && [ -f ~/.android/debug.keystore ]; then
            mkdir -p ci
            cp ~/.android/debug.keystore ci/debug.keystore
            git config user.name "build-bot"
            git config user.email "bot@users.noreply.github.com"
            git add ci/debug.keystore
            git commit -m "save signing key [skip ci]"
            git push || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/Jawaher-Android.apk

  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Arrange files and create firebase_options from firebase_web.txt
        shell: bash
        run: |
          newest() {
            base="$1"; ext="$2"; best=""; bt=-1; bn=-1
            for f in ${base}*.${ext}; do
              [ -f "$f" ] || continue
              case "$f" in
                "${base}.${ext}") n=0 ;;
                "${base} ("[0-9]*").${ext}") n=$(echo "$f" | sed 's/.*(\([0-9]*\)).*/\1/') ;;
                *) continue ;;
              esac
              t=$(git log -1 --format=%ct -- "$f" 2>/dev/null)
              t=${t:-0}
              if [ "$t" -gt "$bt" ] || { [ "$t" -eq "$bt" ] && [ "$n" -gt "$bn" ]; }; then best="$f"; bt=$t; bn=$n; fi
            done
            printf '%s' "$best"
          }
          mkdir -p lib assets
          M="$(newest main dart)"; echo "main -> $M"
          [ -n "$M" ] || { echo "main.dart not found"; exit 1; }
          cp "$M" lib/main.dart
          P="$(newest pubspec yaml)"; echo "pubspec -> $P"
          [ -n "$P" ] || { echo "pubspec.yaml not found"; exit 1; }
          if [ "$P" != "pubspec.yaml" ]; then cp "$P" pubspec.yaml; fi
          L="$(newest logo png)"; echo "logo -> $L"
          if [ -n "$L" ]; then cp "$L" assets/logo.png; fi
          API_KEY=$(grep -o 'apiKey: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          APP_ID=$(grep -o 'appId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          SENDER=$(grep -o 'messagingSenderId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          PROJECT=$(grep -o 'projectId: *"[^"]*"' firebase_web.txt | cut -d'"' -f2)
          if [ -z "$API_KEY" ] || [ -z "$APP_ID" ] || [ -z "$PROJECT" ]; then echo "firebase_web.txt format problem"; exit 1; fi
          printf "import 'package:firebase_core/firebase_core.dart';\nclass DefaultFirebaseOptions {\n  static const FirebaseOptions currentPlatform = FirebaseOptions(\n    apiKey: '%s',\n    appId: '%s',\n    messagingSenderId: '%s',\n    projectId: '%s',\n  );\n}\n" "$API_KEY" "$APP_ID" "$SENDER" "$PROJECT" > lib/firebase_options.dart
      - name: Generate windows folder
        run: flutter create . --org com.goldshop --project-name gold_shop --platforms=windows
      - name: Brand name and icon
        shell: bash
        run: |
          sed -i 's/L"gold_shop"/L"Infinity System"/' windows/runner/main.cpp || true
          if [ -f logo.png ]; then
            pip install pillow || true
            python -c "from PIL import Image; im=Image.open('logo.png').convert('RGBA'); im.save('windows/runner/resources/app_icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])" || true
          fi
      - run: flutter pub get
      - name: Build number
        shell: bash
        run: echo "BN=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Build windows
        shell: bash
        run: flutter build windows --release --dart-define=BUILD_NUMBER=$BN
      - name: Bundle runtime and build single-file installer
        shell: bash
        run: |
          R=build/windows/x64/runner/Release
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll msvcp140_1.dll msvcp140_2.dll concrt140.dll; do
            cp "/c/Windows/System32/$f" "$R/" || true
          done
          rm -f $R/*.lib $R/*.exp
          mv $R/gold_shop.exe $R/Jawaher.exe
          choco install innosetup -y --no-progress
          cat > installer.iss <<'ISS'
          [Setup]
          AppId={{8F3B6A2C-5D41-4E7B-9C21-3A6D5F0B7E11}
          AppName=Infinity System
          AppVersion=1.0
          DefaultDirName={autopf}\Jawaher
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=installer
          OutputBaseFilename=Jawaher-Setup
          Compression=lzma2
          SolidCompression=yes
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\Infinity System"; Filename: "{app}\Jawaher.exe"
          Name: "{autodesktop}\Infinity System"; Filename: "{app}\Jawaher.exe"
          [InstallDelete]
          Type: files; Name: "{autodesktop}\Jawaher.lnk"
          Type: files; Name: "{autoprograms}\Jawaher.lnk"
          [Run]
          Filename: "{app}\Jawaher.exe"; Description: "Run Infinity System"; Flags: nowait postinstall skipifsilent
          Filename: "{app}\Jawaher.exe"; Flags: nowait; Check: WizardSilent
          ISS
          ISCC="$(ls -d /c/Program\ Files*/Inno\ Setup*/ISCC.exe 2>/dev/null | head -n 1)"
          if [ -z "$ISCC" ]; then echo "Inno Setup not found"; exit 1; fi
          "$ISCC" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Jawaher-Setup.exe

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare admin app
        run: |
          newest() {
            base="$1"; ext="$2"; best=""; bt=-1; bn=-1
            for f in ${base}*.${ext}; do
              [ -f "$f" ] || continue
              case "$f" in
                "${base}.${ext}") n=0 ;;
                "${base} ("[0-9]*").${ext}") n=$(echo "$f" | sed 's/.*(\([0-9]*\)).*/\1/') ;;
                *) continue ;;
              esac
              t=$(git log -1 --format=%ct -- "$f" 2>/dev/null)
              t=${t:-0}
              if [ "$t" -gt "$bt" ] || { [ "$t" -eq "$bt" ] && [ "$n" -gt "$bn" ]; }; then best="$f"; bt=$t; bn=$n; fi
            done
            printf '%s' "$best"
          }
          mkdir -p admin_app/lib
          A="$(newest admin_main dart)"; echo "admin_main -> $A"
          [ -n "$A" ] || { echo "admin_main.dart not found"; exit 1; }
          cp "$A" admin_app/lib/main.dart
          AP="$(newest admin_pubspec yaml)"; echo "admin_pubspec -> $AP"
          [ -n "$AP" ] || { echo "admin_pubspec.yaml not found"; exit 1; }
          cp "$AP" admin_app/pubspec.yaml
          API_KEY=$(jq -r '.client[0].api_key[0].current_key' google-services.json)
          APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' google-services.json)
          SENDER=$(jq -r '.project_info.project_number' google-services.json)
          PROJECT=$(jq -r '.project_info.project_id' google-services.json)
          printf "import 'package:firebase_core/firebase_core.dart';\nclass DefaultFirebaseOptions {\n  static const FirebaseOptions currentPlatform = FirebaseOptions(\n    apiKey: '%s',\n    appId: '%s',\n    messagingSenderId: '%s',\n    projectId: '%s',\n  );\n}\n" "$API_KEY" "$APP_ID" "$SENDER" "$PROJECT" > admin_app/lib/firebase_options.dart
      - name: Build admin apk
        working-directory: admin_app
        run: |
          flutter create . --org com.goldshop --project-name jawaher_admin --platforms=android
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle.kts android/app/build.gradle || true
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Jawaher-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: admin-android
          path: admin_app/build/app/outputs/flutter-apk/Jawaher-Admin.apk

  package:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - id: bn
        run: echo "bn=$((100 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build ${{ steps.bn.outputs.bn }}
          files: |
            out/android/Jawaher-Android.apk
            out/installer/Jawaher-Setup.exe
